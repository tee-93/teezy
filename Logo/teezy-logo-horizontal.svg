  <rect x="575" y="520" width="110" height="28" rx="14" fill="#081A4E"/>
  <rect x="575" y="585" width="82" height="28" rx="14" fill="#081A4E"/>
  <rect x="715" y="455" width="38" height="28" rx="14" fill="#081A4E"/>
  <rect x="715" y="520" width="38" height="28" rx="14" fill="#081A4E"/>

  <!-- Text cursor -->
  <line x1="690" y1="390" x2="690" y2="655"
        stroke="#1E63FF" stroke-width="18" stroke-linecap="round"/>
  <line x1="672" y1="390" x2="708" y2="390"
        stroke="#1E63FF" stroke-width="18" stroke-linecap="round"/>
  <line x1="672" y1="655" x2="708" y2="655"
        stroke="#1E63FF" stroke-width="18" stroke-linecap="round"/>

  <!-- Clean-up sparkle -->
