<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    a { color: #57D0FF; } a:hover { color: #8FE1FF; }
    .serif { font-family: Georgia, Cambria, "Segoe UI Variable Display", serif; }
    .label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; color: #6A645C; }
    .cap { font-size: 11px; color: #8A847B; margin-top: 10px; }
    .pill {
      background: linear-gradient(135deg, rgba(46,44,40,0.96), rgba(24,22,20,0.96));
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 18px 40px -18px rgba(0,0,0,0.95);
      display: flex; align-items: center; gap: 11px; padding: 11px 18px;
      color: #EFEBE4; font-size: 13.5px;
    }
    .glyph {
      width: 24px; height: 24px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</helmet>

<div style="width: 900px; height: 330px; padding: 30px 38px; box-sizing: border-box;
     background: linear-gradient(160deg, #22303F 0%, #16202B 55%, #101820 100%); color: #EFEBE4;">

  <div class="label">THE PILL — UNCHANGED, AND WHAT EVERYTHING ELSE NOW MATCHES</div>

  <div style="display: flex; gap: 22px; margin-top: 20px; flex-wrap: wrap; align-items: flex-start;">

    <div>
      <div class="pill">
        <div class="glyph" style="background: linear-gradient(135deg, #2E7BFF, #57D0FF);">
          <svg width="15" height="15" viewBox="0 0 100 100" fill="#FFFFFF" fill-rule="evenodd">
            <path d="M30,14 H70 A16,16 0 0 1 86,30 V58 A16,16 0 0 1 70,74 H46 L30,90 V74 A16,16 0 0 1 14,58 V30 A16,16 0 0 1 30,14 Z
                     M32,30 H60 A5,5 0 0 1 60,40 H32 A5,5 0 0 1 32,30 Z
                     M32,48 H52 A5,5 0 0 1 52,58 H32 A5,5 0 0 1 32,48 Z"/>
          </svg>
        </div>
        <span>Listening</span>
        <div style="display: flex; align-items: center; gap: 3px; margin-left: 4px;">
          <div style="width: 3px; height: 9px;  border-radius: 2px; background: #EFEBE4; opacity: .9;"></div>
          <div style="width: 3px; height: 16px; border-radius: 2px; background: #EFEBE4; opacity: .9;"></div>
          <div style="width: 3px; height: 11px; border-radius: 2px; background: #EFEBE4; opacity: .9;"></div>
          <div style="width: 3px; height: 19px; border-radius: 2px; background: #EFEBE4; opacity: .9;"></div>
          <div style="width: 3px; height: 7px;  border-radius: 2px; background: #EFEBE4; opacity: .9;"></div>
        </div>
      </div>
      <div class="cap">Listening</div>
    </div>

    <div>
      <div class="pill">
        <div class="glyph" style="background: linear-gradient(135deg, #2E7BFF, #57D0FF);">
          <svg width="15" height="15" viewBox="0 0 100 100" fill="#FFFFFF" fill-rule="evenodd">
            <path d="M30,14 H70 A16,16 0 0 1 86,30 V58 A16,16 0 0 1 70,74 H46 L30,90 V74 A16,16 0 0 1 14,58 V30 A16,16 0 0 1 30,14 Z
                     M32,30 H60 A5,5 0 0 1 60,40 H32 A5,5 0 0 1 32,30 Z
                     M32,48 H52 A5,5 0 0 1 52,58 H32 A5,5 0 0 1 32,48 Z"/>
          </svg>
        </div>
        <span>Thinking</span>
        <div style="display: flex; gap: 4px; margin-left: 2px;">
          <div style="width: 5px; height: 5px; border-radius: 3px; background: #57D0FF;"></div>
          <div style="width: 5px; height: 5px; border-radius: 3px; background: #57D0FF; opacity: .55;"></div>
          <div style="width: 5px; height: 5px; border-radius: 3px; background: #57D0FF; opacity: .25;"></div>
        </div>
      </div>
      <div class="cap">Working</div>
    </div>

    <div>
      <div class="pill">
        <div class="glyph" style="background: #4ADE80;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0F2A17" stroke-width="3"
               stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>
        </div>
        <span>Volume 40%</span>
      </div>
      <div class="cap">Did it</div>
    </div>
  </div>

  <div style="margin-top: 24px;">
    <div style="max-width: 420px;" class="pill">
      <div class="glyph" style="background: linear-gradient(135deg, #2E7BFF, #57D0FF); align-self: flex-start;">
        <svg width="15" height="15" viewBox="0 0 100 100" fill="#FFFFFF" fill-rule="evenodd">
          <path d="M30,14 H70 A16,16 0 0 1 86,30 V58 A16,16 0 0 1 70,74 H46 L30,90 V74 A16,16 0 0 1 14,58 V30 A16,16 0 0 1 30,14 Z
                   M32,30 H60 A5,5 0 0 1 60,40 H32 A5,5 0 0 1 32,30 Z
                   M32,48 H52 A5,5 0 0 1 52,58 H32 A5,5 0 0 1 32,48 Z"/>
        </svg>
      </div>
      <span style="line-height: 1.5;">Nothing until four, then the Pursiva review. Origin's bill is due Thursday.</span>
    </div>
    <div class="cap">Answer — the pill grows to fit</div>
  </div>
</div>
</x-dc>
</body>
</html>
